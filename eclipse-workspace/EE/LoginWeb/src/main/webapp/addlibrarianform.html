<h3>Librarian Registration</h3>
  <form action="AddLibrarian" method="post" style="width:300px">
  <div class="form-group">
    <label for="name1">Name <font color="red">*</font></label>
    <input type="text" class="form-control" name="name" id="name1" placeholder="Full Name" required/>
  </div>
  <div class="form-group">
    <label for="username1">Username <font color="red">*</font></label>
    <input type="text" class="form-control" name="username" id="username1" placeholder="Username for login" required/>
  </div>
  <div class="form-group">
    <label for="email1">Email Address <font color="red">*</font></label>
    <input type="email" class="form-control" name="email" id="email1" placeholder="Email" required/>
  </div>
  <div class="form-group">
    <label for="password1">Password <font color="red">*</font></label>
    <input type="password" class="form-control" name="password" id="password1" placeholder="Password" required/>
  </div>  
  <div class="form-group">
    <label for="mobile1">Mobile Number <font color="red">*</font></label>
    <input type="number" class="form-control" name="mobile" id="mobile1" placeholder="10-digit mobile number" required/>
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
</form>
